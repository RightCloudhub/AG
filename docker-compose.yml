services:
  neo4j:
    image: neo4j:5.26-community
    container_name: agr-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/agentic-graphrag
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "agentic-graphrag", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: agr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    profiles: [rerank]
    ports:
      - "127.0.0.1:8081:80"
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--max-client-batch-size", "16"]
    volumes:
      - reranker_data:/data

volumes:
  neo4j_data:
  qdrant_data:
  reranker_data:
