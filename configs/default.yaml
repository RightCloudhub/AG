# AgenticGraphRAG default config (no secrets — use env vars)

app:
  name: agentic-graphrag
  env: local

roles:
  # Null models inherit light (triage/verifier) or strong (researcher/writer).
  # Set both USD prices per million tokens to enable monetary cost reporting.
  triage: {model: null, input_usd_per_million: null, output_usd_per_million: null}
  researcher: {model: null, input_usd_per_million: null, output_usd_per_million: null}
  verifier: {model: null, input_usd_per_million: null, output_usd_per_million: null}
  writer: {model: null, input_usd_per_million: null, output_usd_per_million: null}

agent:
  budget_tiers:
    small: {tokens: 12000, calls: 4, rounds: 1}
    standard: {tokens: 50000, calls: 20, rounds: 5}
    summary: {tokens: 50000, calls: 20, rounds: 3}
  mode: single
  max_parallel: 1
  max_tool_calls: 3
  max_research_calls: 2
  branch_tokens: 12000
  writer_reserve_tokens: 8000
  writer_reserve_calls: 4
  verifier_reserve_tokens: 4000
  max_output_tokens: 1500

guardrails:
  # Opt in after paired evaluation on your retrieval stack. Disabled = same-stack
  # agentic baseline. All existing hop/call/token/time ceilings still apply.
  requirement_register:
    enabled: false     # Legacy direct-graph switch; live single mode always uses the register.
    seed_enabled: true
    updates_enabled: true
    delta_enabled: true
    verifier_enabled: true
    verifier:
      model: null  # Use llm.light_model; set a distinct judge model on the chat endpoint.
      temperature: 0.0
      max_rejections: 2
    answer_policy: partial  # partial | abstain; factual claims still require citations
    seed_top_k: 5
    max_rounds: 15
    context_limit_tokens: 128000
    convergence_ratio: 0.8
    max_requirements: 32
  max_hops: 4          # P95: cap agentic depth (was 5)
  # Breadth budget: plan nodes, a separate budget from depth (BL-12). One hop
  # executes one sub-question, so this must stay ≤ max_hops — above it the plan
  # would be truncated mid-run by the hop cap instead of at plan time.
  # GuardrailConfig clamps it to max_hops if this drifts.
  max_sub_questions: 4
  # BL-12: ready, mutually independent DAG nodes are retrieved concurrently and
  # share one hop, so the hop budget measures dependency depth, not breadth.
  parallel_branches: true
  max_parallel_branches: 3
  # O-7 (docs/design/ARCH_OPTIMIZATION_V2.md): llm | tiered | offline. Env AGR_CRITIC_MODE overrides.
  critic_mode: llm
  max_llm_calls: 16    # P95: tighter budget vs 20
  max_tokens_per_query: 50000
  query_timeout_seconds: 45  # fail faster than 60s wall (AC-4 target 8s still needs live)
  # Worst case: planner + (max_hops+1)*(executor+critic) + answer; LangGraph needs
  # limit > step count → 2*max_hops+5. Keep a little slack over the floor.
  recursion_limit: 15

retrieval:
  top_k: 10
  vector_top_k: 10
  fulltext_top_k: 10
  fusion_method: rrf   # rrf | concat (P3-PERF-03)
  fusion_k: 60
  parallel: true       # P3-PERF-02
  cache_answer_ttl_seconds: 3600
  # Two-stage retrieval (docs/design/ARCH_OPTIMIZATION_V2.md O-5). Env AGR_RERANK overrides kind.
  rerank:
    kind: none           # none | lexical | http | local; live promotion gated by reports/rerank_eval.md
    candidate_pool: 30   # per-channel recall when kind != none
    top_n: null          # defaults to retrieval.top_k; optional legacy override
    endpoint: "http://127.0.0.1:8081/rerank"
    model: "BAAI/bge-reranker-v2-m3" # must match the HTTP service model/revision
    timeout_seconds: 2.0
    batch_size: 16
    max_chars: 2000
    max_query_chars: 1000
    max_length: 512      # local tokenizer pair limit; TEI uses truncate=true
    graph_policy: exempt # score | exempt (keep RRF slots) | floor
    graph_floor: 0.0     # model score units; used only with graph_policy=floor
    failure_threshold: 2
    cooldown_seconds: 20.0
  graph:
    max_hop_neighbors: 2
    max_path_hops: 4
    max_neighbors_per_layer: 50
    max_paths: 20
    beam_width: 20
    high_degree_threshold: 30
    relation_relevance_threshold: 0.12

question_matching_path: configs/question_matching.yaml

triage:
  enabled: true        # P3-PERF-01 — keep on for Fast Path P95 ≤3s simple facts
  escalate_fast_path: true

# O-9: degraded runs must not look like confident answers. Every swallowed
# dependency failure is logged, counted (agr_degradation_total) and reported as
# `degraded_channels`; when *all* channels listed here failed, the answer is
# flagged `low_confidence` in the response instead of passing as a normal answer.
degradation:
  low_confidence_channels: [vector, graph]

knowledge:
  chunk_size_tokens: 512       # Includes breadcrumb; replaces chunk_size_chars.
  chunk_overlap_tokens: 64     # Maximum prose overlap within one heading path.
  tokenizer: cl100k_base       # Bundled offline vocabulary, or a local encoder JSON path.
  parsing:
    encoding_min_confidence: 0.8  # 1 - charset-normalizer chaos; strict UTF-8 preferred.
    encoding_preference: gb18030  # Tie-break only for ambiguous detected encodings.
    mineru:
      enabled: false
      endpoint: ""            # Full MinerU HTTP /file_parse URL; explicitly opt in.
      timeout_seconds: 120
  extract_confidence_threshold: 0.5
  schema_path: configs/schema/domain_v0.yaml
  extract_max_attempts: 3
  extract_retry_base_delay_seconds: 0.5
  extract_journal_path: data/processed/extract_journal.jsonl
  extract_quarantine_path: data/processed/extract_quarantine.jsonl

llm:
  strong_model: gpt-4.1
  light_model: gpt-4.1-mini
  embedding_model: text-embedding-3-small
  # Optional; env LLM_EMBEDDING_BASE_URL / LLM_EMBEDDING_API_KEY preferred.
  # Leave empty to reuse chat LLM_BASE_URL / LLM_API_KEY.
  embedding_base_url: ""
  embedding_api_key: ""
  temperature: 0.0
  max_retries: 2
  timeout_seconds: 60
  entailment_check: true   # BL-13: LIGHT-tier claim entailment judge on the live path
  # O-8 (docs/design/ARCH_OPTIMIZATION_V2.md): one breaker per route (chat:strong /
  # chat:light / embed). Defaults = V1 behaviour.
  resilience:
    failure_threshold: 2     # consecutive failures → open
    cooldown_seconds: 20
    window_seconds: 0        # >0 enables the failure-rate rule below
    failure_rate: 0.5
    min_calls: 5
    fallback_to_light: false # STRONG open → serve with LIGHT model

paths:
  data_dir: data
  raw_docs_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache
  indexes_dir: data/indexes
  prompts_dir: configs/prompts

eval:
  cases_path: evals/datasets/g2_dev.jsonl
  report_dir: reports

tenants: {}
# Per-tenant overrides (ENT-05); example:
#   acme:
#     qps: 5
#     concurrent: 3
#     max_llm_calls: 200

retention:
  audit_chains_days: 90
  audit_events_days: 90
  review_queue_days: 30
  ingest_tasks_days: 30

# Durable ingestion, bounded retries and upload capacity.
indexing:
  embedding_batch_size: 32
  embedding_max_attempts: 4
  retry_base_seconds: 0.5
  retry_max_seconds: 30
  max_file_bytes: 52428800
  max_batch_files: 100
  max_upload_bytes: 524288000
  upload_part_bytes: 5242880
  upload_expiry_seconds: 86400
