[project]
name = "agentic-graphrag-mcp"
version = "0.1.0"
description = "Read-only stdio MCP adapter for the AgenticGraphRAG public API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["agentic-graphrag-client>=0.1,<0.2", "mcp>=1.26,<2", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.14"]

[project.scripts]
ag-mcp = "ag_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_mcp"]

[tool.uv.sources]
agentic-graphrag-client = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ag_mcp"]

[tool.coverage.run]
source = ["ag_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
