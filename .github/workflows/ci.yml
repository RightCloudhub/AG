# CI: lint + architecture metrics + unit tests/coverage + offline eval floor.
# Gates mirror docs/design/REFACTOR_PLAN.md ("每阶段门禁"); keep them in sync.
name: CI

on:
  push:
    branches: [master, main, "feat/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything runs fully offline: no Neo4j/Qdrant services, no LLM key, no network.
# AGR_PROFILE is deliberately unset: unit tests pick their own profile, and
# agr-run-cases always uses the `eval` profile.
env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & architecture metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install "ruff>=0.8.0"

      - name: Ruff lint
        run: ruff check --output-format=github src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      # Files <=300 lines, functions <=50 lines, <=3 positional params,
      # nesting <=3, cyclomatic complexity <=10.
      - name: Code metrics gate
        run: python scripts/check_code_metrics.py

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Includes tests/unit/test_web_claude_ui.py (web workspace structure,
      # injection safety, static assets) — green again since the 2026-10 web rebuild.
      # The core/ dependency-boundary check runs as part of this suite.
      - name: Unit tests + coverage gate
        run: |
          pytest tests/unit \
            --cov=agentic_graphrag \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  eval-offline:
    name: Offline POC eval (floor 21/31)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POC_CASES: evals/datasets/poc_cases.jsonl
      POC_MIN_CORRECT: "21"
      POC_TOTAL: "31"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Production path: QueryApp with the eval profile (memory graph, cache off).
      - name: Eval — agentic path
        run: |
          agr-run-cases --no-llm --memory-graph --cases "$POC_CASES" --run-name ci_poc
          cp reports/poc_accuracy.json reports/ci_poc_accuracy.json
          python scripts/check_eval_floor.py reports/ci_poc_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "agentic"

      - name: Eval — with triage (fast/deep routing)
        run: |
          agr-run-cases --no-llm --memory-graph --enable-triage \
            --cases "$POC_CASES" --run-name ci_poc_triage
          cp reports/poc_accuracy.json reports/ci_poc_triage_accuracy.json
          python scripts/check_eval_floor.py reports/ci_poc_triage_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "triage"

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-eval-reports
          path: |
            reports/ci_poc*.jsonl
            reports/ci_poc*_accuracy.json
          if-no-files-found: ignore
