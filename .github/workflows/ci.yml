# CI: lint + architecture metrics + unit tests/coverage + offline eval floor.
# Gates mirror docs/design/REFACTOR_PLAN.md ("每阶段门禁"); keep them in sync.
# Every install goes through `uv sync --locked` (ADR-008): the committed uv.lock
# is the single version source, so a stale lock fails the build instead of
# silently drifting, and the interpreter follows .python-version.
# Use `--locked`, not `--frozen`: only `--locked` asserts the lockfile is current.
name: CI

on:
  push:
    branches: [master, main, "feat/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything runs fully offline: no Neo4j/Qdrant services, no LLM key, no network
# beyond dependency download.
# AGR_PROFILE is deliberately unset: unit tests pick their own profile, and
# agr-run-cases always uses the `eval` profile.
env:
  UV_VERSION: "0.13.6"

jobs:
  lint:
    name: Lint & architecture metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github src tests scripts

      - name: Ruff format check
        run: uv run --locked ruff format --check src tests scripts

      # Files <=300 lines, functions <=50 lines, <=3 positional params,
      # nesting <=3, cyclomatic complexity <=10.
      - name: Code metrics gate
        run: uv run --locked python scripts/check_code_metrics.py

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (Web, summaries and client contracts)
        run: uv sync --locked --extra dev --extra webapp --extra summary --extra contracts

      - name: Strict Python types
        run: uv run --locked mypy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Validation only: the browser still serves source ESM without a build.
      - name: Strict JavaScript types
        run: npx --yes --package=typescript@5.9.3 tsc --project web/jsconfig.json

      - name: Exported REST and SSE schema drift
        run: uv run --locked python scripts/export_api_contracts.py --check

      - name: REST and SSE compatibility with the PR base
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/export_api_contracts.py --check --base-ref "$API_BASE_REF"

      # The core/ dependency-boundary check runs as part of this suite.
      - name: Unit tests + coverage gate
        run: |
          uv run --locked pytest tests/unit \
            --cov=agentic_graphrag \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  clients:
    name: SDK and MCP packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        project: [sdk/python, integrations/mcp]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            sdk/python/uv.lock
            integrations/mcp/uv.lock
      - name: Sync independently locked package
        run: uv sync --locked --extra dev
      - name: Package lint and types
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
          uv run --locked mypy
      - name: Package tests and coverage
        run: uv run --locked pytest -q --cov
      - name: Build distributable wheel and source archive
        # Build has no --locked flag; validate the package lock before running it.
        run: uv run --locked uv build --no-sources

  eval-offline:
    name: Offline eval (POC 30/31, G2 196/200, probes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POC_CASES: evals/datasets/poc_cases.jsonl
      POC_MIN_CORRECT: "30"
      POC_TOTAL: "31"
      G2_CASES: evals/datasets/g2_all.jsonl
      G2_TRIPLES: data/processed/pilot_triples.jsonl
      G2_MIN_CORRECT: "196"
      G2_TOTAL: "200"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Core package only: the offline eval job must not need the Web extras.
      - name: Sync locked core environment
        run: uv sync --locked

      # Production path: QueryApp with the eval profile (memory graph, cache off).
      - name: Eval — agentic path
        run: |
          uv run --locked agr-run-cases --no-llm --memory-graph --cases "$POC_CASES" --run-name ci_poc
          cp reports/poc_accuracy.json reports/ci_poc_accuracy.json
          uv run --locked python scripts/check_eval_floor.py reports/ci_poc_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "agentic"

      - name: Eval — with triage (fast/deep routing)
        run: |
          uv run --locked agr-run-cases --no-llm --memory-graph --enable-triage \
            --cases "$POC_CASES" --run-name ci_poc_triage
          cp reports/poc_accuracy.json reports/ci_poc_triage_accuracy.json
          uv run --locked python scripts/check_eval_floor.py reports/ci_poc_triage_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "triage"

      # 200 cases: Wilson CI ±5pp vs ±16pp on the 31-case POC (ARCH_OPTIMIZATION_V2 O-1).
      - name: Eval — G2 (200 cases, pilot triples)
        run: |
          uv run --locked agr-run-cases --no-llm --memory-graph --cases "$G2_CASES" \
            --seed-triples "$G2_TRIPLES" --run-name ci_g2
          cp reports/poc_accuracy.json reports/ci_g2_accuracy.json
          uv run --locked python scripts/check_eval_floor.py reports/ci_g2_accuracy.json \
            --min-correct "$G2_MIN_CORRECT" --total "$G2_TOTAL" --label "g2"

      # Unseen compositional forms (4-hop, relative clauses, possessive-free
      # synonyms, constraint intersection) + true negatives (no parent / type
      # breaks / phantom entities) — guards against template overfitting.
      - name: Eval — compositional + negative probes
        run: |
          uv run --locked agr-run-cases --no-llm --memory-graph --cases evals/datasets/probe_compositional.jsonl \
            --seed-triples "$G2_TRIPLES" --run-name ci_probe
          uv run --locked python scripts/check_eval_floor.py reports/ci_probe_accuracy.json \
            --min-correct 52 --total 54 --label "probe"
          uv run --locked agr-run-cases --no-llm --memory-graph --cases evals/datasets/probe_negative.jsonl \
            --seed-triples "$G2_TRIPLES" --run-name ci_probe_neg
          uv run --locked python scripts/check_eval_floor.py reports/ci_probe_neg_accuracy.json \
            --min-correct 19 --total 20 --label "probe-negative"

      # Gold labels were regenerated with correct directions and full answer
      # sets; keep them clean (inverse labels / ambiguous gold now block).
      - name: Gold audit
        run: |
          uv run --locked python scripts/audit_gold.py "$G2_CASES" --triples "$G2_TRIPLES" \
            --json reports/ci_gold_audit.json --max-flagged 0

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-eval-reports
          path: |
            reports/ci_poc*.jsonl
            reports/ci_g2*.jsonl
            reports/ci_*_accuracy.json
            reports/ci_gold_audit.json
          if-no-files-found: ignore
