# CI: lint + architecture metrics + unit tests/coverage + offline eval floor.
# Gates mirror docs/design/REFACTOR_PLAN.md ("每阶段门禁"); keep them in sync.
name: CI

on:
  push:
    branches: [master, main, "feat/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything runs fully offline: no Neo4j/Qdrant services, no LLM key, no network.
# AGR_PROFILE is deliberately unset: unit tests pick their own profile, and
# agr-run-cases always uses the `eval` profile.
env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & architecture metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install "ruff>=0.8.0"

      - name: Ruff lint
        run: ruff check --output-format=github src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      # Files <=300 lines, functions <=50 lines, <=3 positional params,
      # nesting <=3, cyclomatic complexity <=10.
      - name: Code metrics gate
        run: python scripts/check_code_metrics.py

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # tests/unit/test_web_claude_ui.py is excluded: 7 of its tests failed
      # before the refactor because web/static/* is not in the repo
      # (tracked in docs/design/REFACTOR_PLAN.md). Remove the --ignore once fixed.
      # The core/ dependency-boundary check runs as part of this suite.
      - name: Unit tests + coverage gate
        run: |
          pytest tests/unit \
            --ignore=tests/unit/test_web_claude_ui.py \
            --cov=agentic_graphrag \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  eval-offline:
    name: Offline eval (POC 21/31, G2 167/200)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POC_CASES: evals/datasets/poc_cases.jsonl
      POC_MIN_CORRECT: "21"
      POC_TOTAL: "31"
      G2_CASES: evals/datasets/g2_all.jsonl
      G2_TRIPLES: data/processed/pilot_triples.jsonl
      G2_MIN_CORRECT: "167"
      G2_TOTAL: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Production path: QueryApp with the eval profile (memory graph, cache off).
      - name: Eval — agentic path
        run: |
          agr-run-cases --no-llm --memory-graph --cases "$POC_CASES" --run-name ci_poc
          cp reports/poc_accuracy.json reports/ci_poc_accuracy.json
          python scripts/check_eval_floor.py reports/ci_poc_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "agentic"

      - name: Eval — with triage (fast/deep routing)
        run: |
          agr-run-cases --no-llm --memory-graph --enable-triage \
            --cases "$POC_CASES" --run-name ci_poc_triage
          cp reports/poc_accuracy.json reports/ci_poc_triage_accuracy.json
          python scripts/check_eval_floor.py reports/ci_poc_triage_accuracy.json \
            --min-correct "$POC_MIN_CORRECT" --total "$POC_TOTAL" --label "triage"

      # 200 cases: Wilson CI ±5pp vs ±16pp on the 31-case POC (ARCH_OPTIMIZATION_V2 O-1).
      - name: Eval — G2 (200 cases, pilot triples)
        run: |
          agr-run-cases --no-llm --memory-graph --cases "$G2_CASES" \
            --seed-triples "$G2_TRIPLES" --run-name ci_g2
          cp reports/poc_accuracy.json reports/ci_g2_accuracy.json
          python scripts/check_eval_floor.py reports/ci_g2_accuracy.json \
            --min-correct "$G2_MIN_CORRECT" --total "$G2_TOTAL" --label "g2"

      # Report-only: label defects (ambiguous gold, inverse labels) — never blocks.
      - name: Gold audit (report only)
        run: |
          python scripts/audit_gold.py "$G2_CASES" --triples "$G2_TRIPLES" \
            --json reports/ci_gold_audit.json

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-eval-reports
          path: |
            reports/ci_poc*.jsonl
            reports/ci_g2*.jsonl
            reports/ci_*_accuracy.json
            reports/ci_gold_audit.json
          if-no-files-found: ignore
